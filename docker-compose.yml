services:
  rdgen:
    # use bryangerlach/rdgen:latest for the latest build
    #build: .
    image: bryangerlach/rdgen:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      GHUSER: ${GHUSER:?Set GHUSER}
      GHBEARER: ${GHBEARER:?Set GHBEARER}
      GENURL: ${GENURL:-}
      ZIP_PASSWORD: ${ZIP_PASSWORD:?Set ZIP_PASSWORD}
      GHBRANCH: ${GHBRANCH:-master}
      PROTOCOL: ${PROTOCOL:-https}
      REPONAME: ${REPONAME:-rdgen}
      RUSTDESK_REPOSITORY: ${RUSTDESK_REPOSITORY:-rustdesk/rustdesk}
      RUSTDESK_REF: ${RUSTDESK_REF:-}
      RUSTDESK_PUBLIC_KEY_FILE: ${RUSTDESK_PUBLIC_KEY_FILE:-}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      ARTIFACT_ROOT: /opt/rdgen/exe
      GITHUB_POLL_INTERVAL: ${GITHUB_POLL_INTERVAL:-60}
      SH_SECRET: ${SH_SECRET:-}
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
